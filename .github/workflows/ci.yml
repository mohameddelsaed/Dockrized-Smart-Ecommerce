name: Smart Ecommerce CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql, xml, intl, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check Laravel syntax
        run: php artisan --version

      - name: Build backend Docker image
        run: docker build -t smart-ecommerce-backend:test .


  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: FrontEnd/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: FrontEnd
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: FrontEnd
        run: pnpm build

      - name: Build frontend Docker image
        run: docker build -t smart-ecommerce-frontend:test ./FrontEnd


  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Azure VM
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
          AZURE_SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$AZURE_SSH_KEY" > ~/.ssh/azure_key
          chmod 600 ~/.ssh/azure_key

          ssh-keyscan -H "$AZURE_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/azure_key "$AZURE_USER@$AZURE_HOST" << 'EOF'
            set -e

            cd ~/Smart-Ecommerce

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Building Docker images..."
            docker compose build

            echo "Starting containers..."
            docker compose up -d

            echo "Running database migrations..."
            docker compose exec -T backend php artisan migrate --force

            echo "Deployment completed successfully."

            docker compose ps
          EOF