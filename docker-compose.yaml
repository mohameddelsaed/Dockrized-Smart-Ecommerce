services:

  mysql:
    image: mysql:8.4
    container_name: smart-ecommerce-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: smart_ecommerce
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel_password
      MYSQL_ROOT_PASSWORD: root_password

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - smart-ecommerce


  backend:
    image: smart-ecommerce-backend:latest
    container_name: smart-ecommerce-backend
    restart: unless-stopped
    env_file:
      - .env

    depends_on:
      - mysql
    
    networks:
      - smart-ecommerce

  frontend:
    image: smart-ecommerce-frontend:latest
    container_name: smart-ecommerce-frontend
    restart: unless-stopped
    environment:
      Node_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend
    
    networks:
      - smart-ecommerce



  nginx:
    image: nginx:1.27-alpine
    container_name: smart-ecommerce-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend
    
    networks:
      - smart-ecommerce

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: smart-ecommerce-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    networks:
      - smart-ecommerce

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: smart-ecommerce-node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'

    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"

    networks:
      - smart-ecommerce

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: smart-ecommerce-cadvisor
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

    networks:
      - smart-ecommerce

  grafana:
    image: grafana/grafana:12.1.1
    container_name: smart-ecommerce-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - smart-ecommerce

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
networks:
  smart-ecommerce: